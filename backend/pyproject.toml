[project]
name = "ktv-lyrics-backend"
version = "0.1.0"
description = "KTV 練唱工具的本機後端：YouTube 搜尋下載、Demucs 人聲分離、同步歌詞"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "yt-dlp[default]",
    "demucs==4.0.1",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "soundfile>=0.12",
    "numpy>=1.26",
    "httpx>=0.27",
    "cutlet>=0.4",
    "unidic-lite>=1.0.8",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
